<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background for maskable -->
  <rect width="512" height="512" fill="url(#bgMask)"/>

  <!-- Content scaled and centered within the 80% safe zone (x: 51 to 461, y: 51 to 461) -->
  <g transform="translate(51, 51) scale(0.8)">
    <!-- Glowing Accent Aura -->
    <circle cx="256" cy="240" r="140" fill="#06b6d4" opacity="0.2"/>

    <!-- Smartphone Body Frame -->
    <rect x="156" y="80" width="200" height="340" rx="36" fill="#090d16" stroke="url(#phoneGrad)" stroke-width="12"/>

    <!-- Phone Screen -->
    <rect x="172" y="116" width="168" height="268" rx="20" fill="#04121a" stroke="#083344" stroke-width="2"/>

    <!-- Camera / Notch -->
    <circle cx="256" cy="98" r="5" fill="#38bdf8"/>
    <rect x="238" y="90" width="36" height="4" rx="2" fill="#334155"/>

    <!-- Screen Content: Stylized 'NMC' & Circuit -->
    <g transform="translate(186, 140)">
      <path d="M 10 30 L 50 30 L 70 50 L 130 50" fill="none" stroke="#0e7490" stroke-width="3" stroke-linecap="round"/>
      <circle cx="10" cy="30" r="4" fill="#22d3ee"/>
      <circle cx="130" cy="50" r="4" fill="#22d3ee"/>

      <path d="M 70 85 C 40 85 20 110 20 110 C 20 110 40 135 70 135 C 100 135 120 110 120 110 C 120 110 100 85 70 85 Z" fill="none" stroke="#22d3ee" stroke-width="6" stroke-linejoin="round"/>
      <circle cx="70" cy="110" r="14" fill="#38bdf8"/>
      <circle cx="73" cy="107" r="5" fill="#ffffff"/>
    </g>

    <!-- Golden Repair Badge -->
    <g transform="translate(290, 290)">
      <circle cx="60" cy="60" r="56" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="6"/>
      <path d="M 45 35 L 75 65 M 72 32 C 67 27 60 27 55 32 L 48 39 L 55 46 L 46 55 L 39 48 L 32 55 C 27 60 27 67 32 72 C 37 77 44 77 49 72 L 78 43 C 83 38 83 31 78 26 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1.5"/>
      <circle cx="76" cy="76" r="6" fill="#fbbf24"/>
    </g>

    <!-- Brand text -->
    <text x="256" y="468" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#38bdf8" letter-spacing="4">NETRA MOBILE</text>
  </g>
</svg>
